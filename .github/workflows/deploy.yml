name: Deploy OctoCAT to Azure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AZURE_CLIENT_ID" || -z "$AZURE_TENANT_ID" || -z "$AZURE_SUBSCRIPTION_ID" || -z "$RESOURCE_GROUP" || -z "$LOCATION" ]]; then
            echo "::error::Configure the Azure OIDC secrets and resource group/location variables."
            exit 1
          fi

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify resource group exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(az group exists --name "$RESOURCE_GROUP" --output tsv)" != "true" ]]; then
            echo "::error::Resource group '$RESOURCE_GROUP' does not exist. Create it before running this workflow."
            exit 1
          fi

      - name: Find bootstrapped registry
        shell: bash
        run: |
          set -euo pipefail
          ACR_NAME="$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name bootstrap-acr \
            --query properties.outputs.registryName.value \
            --output tsv)"
          if [[ -z "$ACR_NAME" || "$ACR_NAME" == "None" ]]; then
            echo "::error::Run the one-time infra/bootstrap.bicep deployment first."
            exit 1
          fi
          ACR_LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

          docker build \
            --file src/api-py/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/api:$IMAGE_TAG" \
            src
          docker build \
            --file src/frontend/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/frontend:$IMAGE_TAG" \
            src/frontend

          docker push "$ACR_LOGIN_SERVER/api:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/frontend:$IMAGE_TAG"

      - name: Deploy infrastructure and apps
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME="octocat-${GITHUB_RUN_ID}"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters \
              apiImage="$ACR_LOGIN_SERVER/api:$IMAGE_TAG" \
              frontendImage="$ACR_LOGIN_SERVER/frontend:$IMAGE_TAG"

          FRONTEND_URL="$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs.frontendUrl.value \
            --output tsv)"
          echo "Deployment complete: $FRONTEND_URL"
          echo "## OctoCAT deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: $FRONTEND_URL" >> "$GITHUB_STEP_SUMMARY"
